# Keeps the workflow actions current on its own. Without this, action versions
# silently rot until a runtime deprecation breaks a release.
#
# This file only lives on the 1.21.1 branch (Dependabot reads it from there) and
# opens the update pull requests against every version branch through target-branch.
# The other branches have no dependabot.yml.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "Neo/1.21.1"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "Neo/26.1.2"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "Neo/26.2"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "Neo/26.3"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore"
    groups:
      actions:
        patterns: ["*"]
