plugins {
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.gradle.userdev' version '7.0.171'
}

version = minecraft_version + "-" + mod_version + "-" + tag_lanzador
group = mod_group_id

base {
    archivesName = mod_name
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

runs {
    configureEach {
        workingDirectory project.file('run')

        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'

        modSource sourceSets.main
    }

    client {
        programArgument '--quickPlaySingleplayer'
        programArgument 'New World'
    }

    server {
        programArgument '--nogui'
    }

    data {
        workingDirectory project.file('run-data')

        programArguments.addAll '--mod', mod_id,
                                '--all',
                                '--output', file('src/generated/resources/').getAbsolutePath(),
                                '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
        content {
            // ae2, guideme
            includeGroup 'org.appliedenergistics'
        }
    }
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev'
        content {
            // ae2wtlib
            includeGroup 'de.mari_023'
        }
    }
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

dependencies {
    // NeoForge
    implementation "net.neoforged:neoforge:${neo_version}"

    compileOnly "org.jetbrains:annotations:24.1.0"

    // Solo para probar en runClient el ordenado con contenedores de otros mods (no son dependencias del mod)
    // ae2
    runtimeOnly("org.appliedenergistics:appliedenergistics2:${ae2_version}") { transitive = false }
    // guideme
    runtimeOnly("org.appliedenergistics:guideme:${guideme_version}") { transitive = false }
    // ae2wtlib
    runtimeOnly("de.mari_023:ae2wtlib:${ae2wtlib_version}") { transitive = false }
    // sophisticated core
    runtimeOnly("curse.maven:sophisticated-core-${sophisticatedcore_id}:${sophisticatedcore_file_id}") { transitive = false }
    // sophisticated backpacks
    runtimeOnly("curse.maven:sophisticated-backpacks-${sophisticatedbackpacks_id}:${sophisticatedbackpacks_file_id}") { transitive = false }
    // sophisticated storage
    runtimeOnly("curse.maven:sophisticated-storage-${sophisticatedstorage_id}:${sophisticatedstorage_file_id}") { transitive = false }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
        minecraft_version: minecraft_version,
        neo_version: neo_version,
        loader_version: loader_version,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version,
        mod_authors: mod_authors,
        mod_description: mod_description
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            "Specification-Title"     : mod_name,
            "Specification-Vendor"    : mod_authors,
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : project.version,
            "Implementation-Vendor"   : mod_authors,
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

sourceSets {
    main {
        resources {
            exclude '.cache'
        }
    }
}
