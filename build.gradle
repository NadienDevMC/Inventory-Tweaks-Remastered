plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = minecraft_version + "-" + mod_version + "-" + tag_lanzador
group = mod_group_id

base {
    archivesName = mod_name
}

// Minecraft 26.2 runs on Java 25
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Modid for data generation, where to output the resulting resources, and where to look for existing resources
def dataArguments = ['--mod', mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(),
                     '--existing', file('src/main/resources/').getAbsolutePath()]

neoForge {
    version = neo_version

    runs {
        client {
            client()
            gameDirectory = project.file('run')
            programArguments.addAll '--quickPlaySingleplayer', 'New World'
        }

        server {
            server()
            gameDirectory = project.file('run')
            programArgument '--nogui'
        }

        // The data generation is split in two runs since 26.1: the client one writes the translations
        clientData {
            clientData()
            gameDirectory = project.file('run-data')
            programArguments.addAll dataArguments
        }

        serverData {
            serverData()
            gameDirectory = project.file('run-data')
            programArguments.addAll dataArguments
        }

        // applies to all the run configs above
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources {
    exclude '.cache'
    srcDir 'src/generated/resources'
}

repositories {
    mavenCentral()
    maven {
        // AE2, GuideME
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
        content {
            includeGroup 'org.appliedenergistics'
        }
    }
    maven {
        // AE2 Wireless Terminal Library
        name = 'ModMaven'
        url = 'https://modmaven.dev'
        content {
            includeGroup 'de.mari_023'
        }
    }
    maven {
        // Sophisticated Core, Sophisticated Backpacks, Sophisticated Storage
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

dependencies {
    // Only for testing sorting with containers of other mods in runClient (not dependencies of the mod)
    // ae2
    runtimeOnly("org.appliedenergistics:appliedenergistics2:${ae2_version}") { transitive = false }
    // guideme
    runtimeOnly("org.appliedenergistics:guideme:${guideme_version}") { transitive = false }
    // ae2wtlib
    runtimeOnly("de.mari_023:ae2wtlib:${ae2wtlib_version}") { transitive = false }
    // sophisticated core
    runtimeOnly("curse.maven:sophisticated-core-${sophisticatedcore_id}:${sophisticatedcore_file_id}") { transitive = false }
    // sophisticated backpacks
    runtimeOnly("curse.maven:sophisticated-backpacks-${sophisticatedbackpacks_id}:${sophisticatedbackpacks_file_id}") { transitive = false }
    // sophisticated storage
    runtimeOnly("curse.maven:sophisticated-storage-${sophisticatedstorage_id}:${sophisticatedstorage_file_id}") { transitive = false }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
        minecraft_version: minecraft_version,
        neo_version: neo_version,
        loader_version: loader_version,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version,
        mod_authors: mod_authors,
        mod_description: mod_description
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            "Specification-Title"     : mod_name,
            "Specification-Vendor"    : mod_authors,
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : project.version,
            "Implementation-Vendor"   : mod_authors,
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.getRelease().set(25)
}

// Both data runs in a row (the client one first)
tasks.register('runData') {
    group = 'mod development'
    description = 'Runs the client and the server data generation.'
    dependsOn 'runClientData'
    dependsOn 'runServerData'
}
tasks.matching { it.name == 'runServerData' }.configureEach { mustRunAfter 'runClientData' }
